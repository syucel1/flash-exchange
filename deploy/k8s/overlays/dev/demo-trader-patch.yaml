apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
spec:
  template:
    spec:
      containers:
        - name: demo-trader
          image: flash-exchange
          args: ["demo-trader"]
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx128m"
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /opt/flashex/config}
