# Matching engine in a container, sharing the standalone media driver over IPC (/dev/shm/aeron).
# Override any key with -Dflash.engine.<key>=... in JAVA_OPTS.
flash.engine.transport=IPC
flash.engine.aeron.embeddedMediaDriver=false
flash.engine.aeron.dir=/dev/shm/aeron

flash.engine.http.host=0.0.0.0
flash.engine.http.port=8080

flash.engine.ringBufferSize=65536
flash.engine.waitStrategy=SLEEPING
flash.engine.ingressIdleStrategy=BACKOFF
flash.engine.matcherShards=2
flash.engine.orderPoolSize=65536
flash.engine.snapshot.intervalMs=1000
flash.engine.snapshot.depth=0

# id,symbol,tickSize,lotSize,minQty,maxQty,collarBps  (prices 5 dp, USDJPY 3 dp; quantities 2 dp)
flash.engine.instruments=\
  1,EURUSD,1,100,100,10000000000,500;\
  2,GBPUSD,1,100,100,10000000000,500;\
  3,USDJPY,1,100,100,10000000000,500;\
  4,EURGBP,1,100,100,10000000000,500
