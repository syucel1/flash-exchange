# Standalone Aeron media driver shared over IPC by co-located containers (they mount the same /dev/shm).
aeron.dir=/dev/shm/aeron
aeron.dir.delete.on.start=true
aeron.dir.delete.on.shutdown=true
# SHARED: one thread (development). Production: DEDICATED with busy-spin idle strategies on isolated cores.
aeron.threading.mode=SHARED
# 16 MiB IPC terms keep /dev/shm usage modest (default 64 MiB per publication)
aeron.ipc.term.buffer.length=16777216
aeron.term.buffer.length=16777216
aeron.print.configuration=false
