# HA engine node A (node id 1) of a primary/standby pair supervised by the arbiter.
# Both nodes use the same ports on different hosts. Roles are assigned at runtime: the arbiter promotes one node,
# the other bootstraps from its archive and follows its journal. A fenced node exits with status 3 and is restarted.
flash.engine.transport=UDP
flash.engine.udp.host=engine-a
flash.engine.udp.commandPort=40101
flash.engine.udp.executionControlPort=40201
flash.engine.udp.marketDataControlPort=40301

flash.engine.aeron.embeddedMediaDriver=true
flash.engine.aeron.dir=/dev/shm/aeron-engine
flash.engine.aeron.driverThreadingMode=SHARED
flash.engine.aeron.termLength=16777216

flash.engine.http.host=0.0.0.0
flash.engine.http.port=8080

flash.engine.waitStrategy=SLEEPING
flash.engine.matcherShards=2
flash.engine.snapshot.intervalMs=1000

flash.engine.journal.enabled=true
flash.engine.data.dir=/var/lib/flashex/data
flash.engine.archive.host=engine-a
flash.engine.archive.controlPort=8010
flash.engine.snapshot.state.intervalMs=60000
flash.engine.snapshot.state.intervalCommands=100000

flash.engine.ha.enabled=true
flash.engine.ha.nodeId=1
# SYNC: output leaves the primary only after the standby journaled the command (RPO 0); ASYNC: lower latency
flash.engine.ha.mode=SYNC
flash.engine.ha.ackTimeoutMs=200
flash.engine.ha.heartbeatIntervalMs=50
flash.engine.ha.self.host=engine-a
flash.engine.ha.self.replicationPort=40111
flash.engine.ha.self.ackPort=40112
flash.engine.ha.self.controlPort=40113
flash.engine.ha.peer.host=engine-b
flash.engine.ha.peer.archivePort=8010
flash.engine.ha.peer.ackPort=40112
flash.engine.ha.arbiter.host=arbiter
flash.engine.ha.arbiter.port=40901

flash.engine.instruments=\
  1,EURUSD,1,100,100,10000000000,500;\
  2,GBPUSD,1,100,100,10000000000,500;\
  3,USDJPY,1,100,100,10000000000,500;\
  4,EURGBP,1,100,100,10000000000,500
