# Arbiter (witness) of the HA engine pair: elects the primary, grants its lease and fails over.
flash.arbiter.listen.host=arbiter
flash.arbiter.listen.port=40901
# promotion preference order: id=host:controlPort
flash.arbiter.nodes=1=engine-a:40113,2=engine-b:40113
# the primary stops taking commands when its lease is not renewed; the standby is promoted only after
# primaryTimeoutMs of silence AND leaseDurationMs + leaseGuardMs since the last grant
flash.arbiter.leaseDurationMs=300
flash.arbiter.primaryTimeoutMs=250
flash.arbiter.leaseGuardMs=100
flash.arbiter.startupGraceMs=5000
flash.arbiter.state.file=/var/lib/flashex/arbiter.state
flash.arbiter.aeron.embeddedMediaDriver=true
flash.arbiter.aeron.dir=/dev/shm/aeron-arbiter
flash.arbiter.http.host=0.0.0.0
flash.arbiter.http.port=8080
