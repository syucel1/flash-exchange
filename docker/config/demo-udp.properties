# Demo trader on another "box": own embedded media driver, reaches the engine over reliable UDP.
flash.demo.transport=UDP
flash.demo.aeron.dir=/dev/shm/aeron-demo
flash.demo.aeron.embeddedMediaDriver=true
flash.demo.udp.engineHost=matching-engine-udp
flash.demo.udp.clientHost=demo-trader-udp
flash.demo.udp.commandPort=40101
flash.demo.udp.executionControlPort=40201
flash.demo.udp.marketDataControlPort=40301
flash.demo.userBase=5000
flash.demo.instruments=\
  1,EURUSD,108345,1,100;\
  2,GBPUSD,127184,1,100;\
  3,USDJPY,152183,1,100;\
  4,EURGBP,85190,1,100
flash.demo.users=50
flash.demo.ordersPerSecond=200
flash.demo.reportIntervalSeconds=10
flash.demo.spreadTicks=20
flash.demo.marketOrderPercent=10
flash.demo.cancelPercent=15
flash.demo.maxLots=50
