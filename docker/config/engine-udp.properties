# Matching engine reachable over Aeron reliable UDP (engine and clients on different hosts/containers).
# Each side runs its own embedded media driver. Set the advertised host with -Dflash.engine.udp.host=<host>.
flash.engine.transport=UDP
flash.engine.udp.host=matching-engine-udp
flash.engine.udp.commandPort=40101
flash.engine.udp.executionControlPort=40201
flash.engine.udp.marketDataControlPort=40301

flash.engine.aeron.embeddedMediaDriver=true
flash.engine.aeron.dir=/dev/shm/aeron-engine
flash.engine.aeron.driverThreadingMode=SHARED
flash.engine.aeron.termLength=16777216

flash.engine.http.host=0.0.0.0
flash.engine.http.port=8080

flash.engine.waitStrategy=SLEEPING
flash.engine.matcherShards=2
flash.engine.snapshot.intervalMs=1000

flash.engine.instruments=\
  1,EURUSD,1,100,100,10000000000,500;\
  2,GBPUSD,1,100,100,10000000000,500;\
  3,USDJPY,1,100,100,10000000000,500;\
  4,EURGBP,1,100,100,10000000000,500
