# Flash Exchange matching engine - same-box deployment (Aeron IPC over shared memory).
# Every key can be overridden with a JVM system property of the same name (-Dflash.engine.xxx=...).

# ---- transport -----------------------------------------------------------------------------------------------
# IPC: commands (1001), execution events (2001) and market data (3001) all use aeron:ipc.
flash.engine.transport=IPC

# Media driver. Embedded is simplest; in production run a standalone driver and set embeddedMediaDriver=false.
flash.engine.aeron.embeddedMediaDriver=true
# Clients on the same box must use the same directory. On Linux prefer /dev/shm.
flash.engine.aeron.dir=/dev/shm/flash-exchange
# SHARED (dev, 1 thread) | SHARED_NETWORK | DEDICATED (prod, 3 threads)
flash.engine.aeron.driverThreadingMode=SHARED
flash.engine.aeron.deleteDirOnStart=true
# 0 = driver default (64 MiB IPC, 16 MiB network). Must be a power of two >= 65536.
flash.engine.aeron.termLength=0

# ---- pipeline ------------------------------------------------------------------------------------------------
flash.engine.ringBufferSize=65536
# BUSY_SPIN (prod, pinned cores) | YIELDING | SLEEPING (dev default) | BLOCKING
flash.engine.waitStrategy=SLEEPING
# BUSY_SPIN | NO_OP | YIELDING | BACKOFF | SLEEPING
flash.engine.ingressIdleStrategy=BACKOFF
# Number of matcher threads; instruments are assigned to shard (instrumentId mod matcherShards).
flash.engine.matcherShards=1
flash.engine.fragmentLimit=256
flash.engine.orderPoolSize=65536
flash.engine.publish.retryTimeoutMs=1000
flash.engine.shutdownTimeoutMs=5000

# ---- market data ---------------------------------------------------------------------------------------------
# Full-book snapshots for every instrument every N ms (0 = only on request).
flash.engine.snapshot.intervalMs=1000
# Levels per side in snapshots (0 = full depth).
flash.engine.snapshot.depth=0

# ---- instruments ---------------------------------------------------------------------------------------------
# id,symbol,tickSize,lotSize,minQty,maxQty,collarBps ; separated by semicolons.
# Prices use 5 decimals (1.08345 -> 108345), quantities 2 decimals (1000.00 -> 100000).
# collarBps: market order protection band around the best opposite price (500 = 5%).
flash.engine.instruments=\
  1,EURUSD,1,100,100,10000000000,500;\
  2,GBPUSD,1,100,100,10000000000,500;\
  3,USDJPY,1,100,100,10000000000,500;\
  4,EURGBP,1,100,100,10000000000,500
