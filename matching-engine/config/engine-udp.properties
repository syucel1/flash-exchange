# Flash Exchange matching engine - networked deployment (Aeron reliable UDP).
# The trading service connects from other hosts with EngineChannels.udpClientSide(engineHost, clientHost, ...).

flash.engine.transport=UDP
# Address of this engine host as reachable by clients (bind address of the command endpoint and the MDC controls).
flash.engine.udp.host=10.0.0.10
flash.engine.udp.commandPort=40101
flash.engine.udp.executionControlPort=40201
flash.engine.udp.marketDataControlPort=40301

# Optional explicit channels (override the derived ones), e.g. multicast market data:
# flash.engine.channel.marketData=aeron:udp?endpoint=239.10.1.1:40301|interface=10.0.0.10
# flash.engine.stream.command=1001
# flash.engine.stream.execution=2001
# flash.engine.stream.marketData=3001

flash.engine.aeron.embeddedMediaDriver=true
flash.engine.aeron.dir=/dev/shm/flash-exchange
flash.engine.aeron.driverThreadingMode=DEDICATED

flash.engine.ringBufferSize=131072
flash.engine.waitStrategy=BUSY_SPIN
flash.engine.ingressIdleStrategy=BUSY_SPIN
flash.engine.matcherShards=2
flash.engine.snapshot.intervalMs=1000
flash.engine.snapshot.depth=0

flash.engine.instruments=\
  1,EURUSD,1,100,100,10000000000,500;\
  2,GBPUSD,1,100,100,10000000000,500;\
  3,USDJPY,1,100,100,10000000000,500;\
  4,EURGBP,1,100,100,10000000000,500
