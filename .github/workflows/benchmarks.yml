name: Nightly benchmarks

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: JMH benchmark regex (empty = all)
        required: false
        default: ""

permissions:
  contents: write
  deployments: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build benchmarks jar
        run: sh ./mvnw -B -ntp -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -Djacoco.skip package -pl matching-engine-bench -am

      - name: Run JMH
        env:
          FILTER: ${{ github.event.inputs.filter }}
        run: |
          java --add-exports java.base/jdk.internal.misc=ALL-UNNAMED \
            -jar matching-engine-bench/target/benchmarks.jar ${FILTER:+"$FILTER"} \
            -bm thrpt -tu ms -wi 2 -i 3 -f 1 -rf json -rff jmh-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: jmh-result-${{ github.run_number }}
          path: jmh-result.json
          retention-days: 90

      - name: Track results and alert on regressions
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Matching engine (JMH)
          tool: jmh
          output-file-path: jmh-result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks
          alert-threshold: "150%"
          comment-on-alert: false
          fail-on-alert: false
