name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  MAVEN_ARGS: -B -ntp -Dstyle.color=always

jobs:
  build:
    name: Build, test, analyse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify (checkstyle, unit + Aeron integration tests, JaCoCo gate, SpotBugs)
        run: sh ./mvnw verify -Dbuild.revision=${{ github.sha }}

      - name: Test report
        if: always()
        run: |
          {
            echo "### Test results"
            for f in */target/surefire-reports/*.txt */target/failsafe-reports/*.txt; do
              [ -f "$f" ] && grep -h "Tests run" "$f"
            done | awk -F'[ ,]+' '{t+=$3; f+=$5; e+=$7; s+=$9} END {printf "| run | failures | errors | skipped |\n|---|---|---|---|\n| %d | %d | %d | %d |\n", t, f, e, s}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
            */target/site/jacoco/
            */target/spotbugsXml.xml
            */target/checkstyle-result.xml
          retention-days: 14

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: matching-engine/target/matching-engine-*-all.jar
          retention-days: 7

  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: matching-engine/target

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr

      - name: Build image (local, for scanning and smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: flash-exchange:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flash-exchange:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Vulnerability report (HIGH, informational)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flash-exchange:ci
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: docker-compose smoke test (IPC and UDP stacks)
        env:
          FLASHEX_IMAGE: flash-exchange:ci
        run: bash scripts/compose-smoke-test.sh --udp

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true
