version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      aeron:
        patterns: ["io.aeron:*", "org.agrona:*"]
      test:
        patterns: ["org.junit*"]
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*", "org.codehaus.mojo:*", "org.jacoco:*", "com.github.spotbugs:*", "com.puppycrawl.tools:*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
